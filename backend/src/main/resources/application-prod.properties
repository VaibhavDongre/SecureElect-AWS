# DB
#spring.datasource.url=jdbc:mysql://secureelect.cfoei6iu623p.ap-south-1.rds.amazonaws.com:3306/secureelect
spring.datasource.url=jdbc:mysql://secureelect.cfoei6iu623p.ap-south-1.rds.amazonaws.com:3306/secureelect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Default Admin
app.default.admin.email=${ADMIN_EMAIL}
app.default.admin.password=${ADMIN_PASSWORD}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
